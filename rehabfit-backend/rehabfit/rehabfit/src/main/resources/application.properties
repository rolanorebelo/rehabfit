spring.application.name=rehabfit

# --- DATABASE CONFIG ---
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Bind to Render's port
server.port=${PORT:8080}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG

# CORS
app.cors.allowed-origins=${CORS_ORIGINS}

# API Keys
openai.api.key=${OPENAI_API_KEY}
pinecone.api.key=${PINECONE_API_KEY}
pinecone.environment=${PINECONE_ENVIRONMENT}
pinecone.index=${PINECONE_INDEX}
pinecone.project=${PINECONE_PROJECT}
youtube.api.key=${YOUTUBE_API_KEY}

# No fallback to localhost on Render
embedding.service.url=${EMBEDDING_SERVICE_URL}
