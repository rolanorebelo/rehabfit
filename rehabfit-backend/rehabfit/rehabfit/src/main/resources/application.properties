spring.application.name=rehabfit

# --- DATABASE CONFIG ---
# Use DATABASE_URL (JDBC format) or JDBC_DATABASE_URL from Render, fallback to local
spring.datasource.url=${DATABASE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/rehabfitdb}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:secure_password_123}

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Bind to Render's port
server.port=${PORT:8080}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# API Keys
openai.api.key=${OPENAI_API_KEY}
pinecone.api.key=${PINECONE_API_KEY}
pinecone.environment=${PINECONE_ENVIRONMENT}
pinecone.index=${PINECONE_INDEX}
pinecone.project=${PINECONE_PROJECT}
youtube.api.key=${YOUTUBE_API_KEY}

# No fallback to localhost on Render
embedding.service.url=${EMBEDDING_SERVICE_URL:http://localhost:5005}

# --- EMAIL CONFIG ---
# Email enabled flag (set to true when mail config is provided)
spring.mail.enabled=${MAIL_ENABLED:false}

# SMTP Configuration (Gmail example - can use SendGrid, AWS SES, etc.)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# Frontend URL for reset links
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
