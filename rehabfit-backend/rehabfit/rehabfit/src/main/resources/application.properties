spring.application.name=rehabfit

# --- DATABASE CONFIG ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rehabfitdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secure_password_123}

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Bind to Render's port
server.port=${PORT:8080}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# API Keys
openai.api.key=${OPENAI_API_KEY}
pinecone.api.key=${PINECONE_API_KEY}
pinecone.environment=${PINECONE_ENVIRONMENT}
pinecone.index=${PINECONE_INDEX}
pinecone.project=${PINECONE_PROJECT}
youtube.api.key=${YOUTUBE_API_KEY}

# No fallback to localhost on Render
embedding.service.url=${EMBEDDING_SERVICE_URL:http://localhost:5005}
