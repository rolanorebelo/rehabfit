services:
  # RehabFit Backend API
  - type: web
    name: rehabfit-backend
    runtime: docker
    repo: https://github.com/rolanorebelo/rehabfit
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/rag/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rehabfit-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: rehabfit-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rehabfit-db
          property: password
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_ENVIRONMENT
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: PINECONE_PROJECT
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://rehabfit.vercel.app
      - key: EMBEDDING_SERVICE_URL
        value: https://rehabfit-embedding.onrender.com
      - key: FRONTEND_URL
        value: https://rehabfit.vercel.app
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: app.keepalive.enabled
        value: "true"

  # RehabFit Embedding Service
  - type: web
    name: rehabfit-embedding
    runtime: docker
    repo: https://github.com/rolanorebelo/rehabfit
    region: oregon
    plan: free
    dockerfilePath: ./rehabfit-embedding-service/Dockerfile
    dockerContext: ./rehabfit-embedding-service
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production

databases:
  # PostgreSQL Database
  - name: rehabfit-db
    databaseName: rehabfit
    user: rehabfit_user
    region: oregon
    plan: free